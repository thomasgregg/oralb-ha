name: Release

on:
  release:
    types:
      - published
      - edited
  workflow_dispatch:

permissions: {}

jobs:
  validate-notes:
    name: Validate release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate archived notes
        run: python tools/check_release_notes.py
      - name: Validate release event
        if: github.event_name == 'release'
        run: python tools/check_release_notes.py --event "$GITHUB_EVENT_PATH"

  release-zip:
    needs: validate-notes
    if: github.event_name == 'release' && github.event.action == 'published'
    name: Publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Build integration ZIP
        run: git archive --format=zip --output="$RUNNER_TEMP/oralb_live.zip" HEAD:custom_components/oralb_live

      - name: Upload integration ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "$RUNNER_TEMP/oralb_live.zip"
          --clobber
